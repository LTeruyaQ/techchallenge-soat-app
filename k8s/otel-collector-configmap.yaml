apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      resource:
        attributes:
          - key: deployment.environment
            value: "${environment}"
            action: upsert

    exporters:
      # Datadog Exporter
      datadog:
        api:
          key: $${DD_API_KEY}
          site: datadoghq.com
        traces:
          span_name_as_resource_name: true
        metrics:
          resource_attributes_as_tags: true

      # New Relic via OTLP (US region)
      otlphttp/newrelic:
        endpoint: https://otlp.nr-data.net
        headers:
          api-key: $${NR_LICENSE_KEY}

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [datadog, otlphttp/newrelic]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [datadog, otlphttp/newrelic]
