apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: mecanicaos
type: Opaque
stringData:
  # Chave secreta para assinar e validar os tokens JWT.
  # O nome "Jwt__SecretKey" corresponde à estrutura de configuração
  # esperada pelo IConfiguration do .NET (seção "Jwt", chave "SecretKey").
  Jwt__SecretKey: "${jwt_secret}"

  # String de conexão completa para o banco de dados RDS.
  DB_CONNECTION_STRING: "Host=${db_host};Port=5432;Database=${db_name};Username=${db_user};Password=${db_password}"
