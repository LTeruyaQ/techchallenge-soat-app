name: CD

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]

env:
  AWS_REGION: 'us-east-1'
  ECR_REPOSITORY: 'mecanicaos-ecr'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.get_sha.outputs.sha }}
      owner_lowercase: ${{ steps.convert_owner.outputs.name }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Obter o SHA do commit
        id: get_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Converter nome do repositório para minúsculas
        id: convert_owner
        run: echo "name=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Construir e enviar a imagem Docker para GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.convert_owner.outputs.name }}/mecanicaos-api:${{ steps.get_sha.outputs.sha }}
            ghcr.io/${{ steps.convert_owner.outputs.name }}/mecanicaos-api:latest

      # Push para ECR (se credenciais AWS estiverem configuradas)
      - name: Configurar credenciais AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Login no Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      - name: Push para ECR
        if: steps.login-ecr.outcome == 'success'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ghcr.io/${{ steps.convert_owner.outputs.name }}/mecanicaos-api:${{ steps.get_sha.outputs.sha }} ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ steps.get_sha.outputs.sha }}
          docker tag ghcr.io/${{ steps.convert_owner.outputs.name }}/mecanicaos-api:latest ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ steps.get_sha.outputs.sha }}
          docker push ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest
          echo "✅ Imagem enviada para ECR: ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ steps.get_sha.outputs.sha }}"

  validate-k8s-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Atualizar a tag da imagem no manifesto de deploy
        run: |
          echo "A nova tag da imagem é: ${{ needs.build-and-push.outputs.image_tag }}"
          sed -i "s|image:.*|image: ghcr.io/${{ needs.build-and-push.outputs.owner_lowercase }}/mecanicaos-api:${{ needs.build-and-push.outputs.image_tag }}|g" k8s/api-deployment.yaml
          echo "Manifesto de deploy da API atualizado:"
          cat k8s/api-deployment.yaml

      - name: Instalar Kubeconform
        run: |
          echo "Instalando Kubeconform..."
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validar manifestos do Kubernetes
        run: |
          echo "🔍 Validando manifestos com Kubeconform..."
          kubeconform -strict -ignore-missing-schemas -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}.json' \
            -kubernetes-version 1.30.0 k8s/
